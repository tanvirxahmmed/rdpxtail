name: 🖥️ Windows RDP via Tailscale

# ─────────────────────────────────────────────────────────────────
# Prerequisites (set in repo Settings → Secrets and variables → Actions):
#   TAILSCALE_AUTHKEY  — ephemeral, reusable auth key from
#                        https://login.tailscale.com/admin/settings/keys
# ─────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Session duration in minutes (max 350)"
        required: false
        default: "60"
        type: string

      rdp_password:
        description: "RDP password (leave blank to auto-generate)"
        required: false
        default: ""
        type: string

      hostname:
        description: "Tailscale hostname for this runner"
        required: false
        default: "gh-windows-rdp"
        type: string

jobs:
  rdp-session:
    name: Windows RDP Session
    runs-on: windows-latest
    timeout-minutes: 360          # hard cap — GitHub maximum is 360

    steps:
      # ── 1. Enable RDP ──────────────────────────────────────────
      - name: 🔧 Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          # Allow incoming RDP connections
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          # Disable Network Level Authentication (NLA) so any RDP client works
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          # Open firewall for RDP (port 3389)
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Remote Desktop enabled."

      # ── 2. Set RDP credentials ─────────────────────────────────
      - name: 🔑 Configure RDP user & password
        shell: powershell
        run: |
          $username = $env:USERNAME          # "runneradmin" on GitHub-hosted runners

          # Use provided password or generate a secure one
          $customPw = "${{ inputs.rdp_password }}"
          if ($customPw -ne "") {
            $password = $customPw
          } else {
            # Build a password that satisfies Windows complexity rules:
            # uppercase + lowercase + digit + special, 16 chars total
            $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
            $lower   = "abcdefghijkmnpqrstuvwxyz"
            $digits  = "0123456789"
            $special = "!@#$%"
            $pool    = $upper + $lower + $digits + $special

            $core = -join (1..12 | ForEach-Object { $pool[(Get-Random -Maximum $pool.Length)] })
            $password = "Gh" + $core + "9!"   # guaranteed complexity
          }

          # Apply the password
          net user $username $password | Out-Null

          # Add user to Remote Desktop Users group (already admin, but just in case)
          net localgroup "Remote Desktop Users" $username /add 2>$null

          # Persist for later steps
          "RDP_USER=$username"   >> $env:GITHUB_ENV
          "RDP_PASS=$password"   >> $env:GITHUB_ENV

          Write-Host "Credentials configured for user: $username"

      # ── 3. Install Tailscale ───────────────────────────────────
      - name: 📦 Install Tailscale
        shell: powershell
        run: |
          $installer = "$env:TEMP\tailscale-setup.exe"

          Write-Host "Downloading Tailscale installer..."
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer `
            -UseBasicParsing

          Write-Host "Installing Tailscale (silent)..."
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          # Give the background service a moment to start
          Start-Sleep -Seconds 6

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
            Write-Error "Tailscale executable not found at expected path!"
            exit 1
          }
          Write-Host "Tailscale installed."

      # ── 4. Connect to Tailscale network ───────────────────────
      - name: 🔗 Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ts       = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname = "${{ inputs.hostname }}-${{ github.run_number }}"

          Write-Host "Connecting to Tailscale as '$hostname'..."
          & $ts up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="$hostname" `
            --accept-routes `
            --accept-dns `
            --reset

          # Wait for the IP assignment
          Start-Sleep -Seconds 8

          $tsIP = & $ts ip -4 2>$null
          if (-not $tsIP) {
            Write-Error "Could not retrieve Tailscale IP — check that TAILSCALE_AUTHKEY is valid."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "   ✅  RDP SESSION READY"
          Write-Host "=============================================="
          Write-Host "   Host     : $tsIP"
          Write-Host "   Port     : 3389"
          Write-Host "   Username : $env:RDP_USER"
          Write-Host "   Password : $env:RDP_PASS"
          Write-Host "=============================================="
          Write-Host "   Quick connect (Windows):"
          Write-Host "     mstsc /v:${tsIP}"
          Write-Host ""
          Write-Host "   macOS (Microsoft Remote Desktop):"
          Write-Host "     Add PC → $tsIP"
          Write-Host "=============================================="

      # ── 5. Keep the runner alive ───────────────────────────────
      - name: ⏳ Keep session alive
        shell: powershell
        run: |
          $minutes  = [Math]::Min([int]"${{ inputs.timeout_minutes }}", 350)
          $endTime  = (Get-Date).AddMinutes($minutes)
          $interval = 60    # print status every 60 s

          Write-Host ""
          Write-Host "Session will end at : $($endTime.ToString('yyyy-MM-dd HH:mm:ss UTC'))"
          Write-Host "Tailscale IP        : $env:TAILSCALE_IP"
          Write-Host "RDP username        : $env:RDP_USER"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {
            $remaining = [Math]::Round(($endTime - (Get-Date)).TotalMinutes, 1)
            $ts        = "C:\Program Files\Tailscale\tailscale.exe"
            $status    = (& $ts status --json | ConvertFrom-Json).BackendState
            Write-Host "$(Get-Date -Format 'HH:mm:ss')  |  $remaining min remaining  |  Tailscale: $status"
            Start-Sleep -Seconds $interval
          }

          Write-Host ""
          Write-Host "⌛ Session timeout reached. Runner will now exit."
